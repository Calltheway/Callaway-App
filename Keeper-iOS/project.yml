name: Keeper
options:
  bundleIdPrefix: com.keeper
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.keeper.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # fill in your Apple team ID
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Keeper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keeper
    settings:
      base:
        INFOPLIST_FILE: Keeper/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keeper.app
        PRODUCT_NAME: Keeper
    entitlements:
      path: Keeper/Resources/Keeper.entitlements
    dependencies:
      - package: Supabase
        product: Auth
      - package: Supabase
        product: PostgREST
      - package: Supabase
        product: Storage
    info:
      path: Keeper/Resources/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSFaceIDUsageDescription: "Keeper uses Face ID to protect your financial data."
        NSCameraUsageDescription: "Not used."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CFBundleDisplayName: Keeper
        CFBundleName: Keeper
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false

  KeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeeperTests
    dependencies:
      - target: Keeper
